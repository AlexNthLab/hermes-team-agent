name: 🧬 Team Evolution Daily Review

# Team Layer 专属 — 不影响 Hermes 上游 workflows
# 每日 23:00 UTC 汇总各终端日志，触发 EvoLoop，生成 PR

on:
  schedule:
    # 每天 UTC 23:00 (北京时间 07:00)
    - cron: "0 23 * * *"
  workflow_dispatch:  # 允许手动触发

# 仅在 team-layer-v1 分支运行
defaults:
  run:
    shell: bash

jobs:
  aggregate-and-evolve:
    runs-on: ubuntu-latest
    # 仅在我们的 fork 上运行（避免上游 fork 误触发）
    if: github.repository == 'AlexNthLab/hermes-team-agent'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout team-layer-v1
        uses: actions/checkout@v4
        with:
          ref: team-layer-v1
          fetch-depth: 0  # 完整历史，便于后续 rebase upstream

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify team_layer can import (zero deps check)
        run: |
          python -c "from team_layer.git_sync import CentralAggregator; print('OK')"
          python -c "from team_layer.evolution import EvoLoop; print('OK')"

      - name: Run Central Aggregator
        id: aggregate
        env:
          EVOLUTION_BUDGET: "15000"
          # CI 友好的 hostname/username
          HOSTNAME: "github-actions"
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python -c "
          from team_layer.git_sync import CentralAggregator, SyncConfig
          cfg = SyncConfig()
          print(cfg.describe())
          agg = CentralAggregator(cfg, noise_min_count=2)
          report = agg.run(trigger_evolution=True)
          print(f'Auto-merged: {len(report.auto_merged)}')
          print(f'Pending review: {len(report.pending_review)}')
          print(f'Rejected: {len(report.rejected)}')
          "

      - name: Check for changes
        id: diff
        run: |
          git add skills/registry sidechain || true
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No evolution outcomes to merge."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Evolution Review PR
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: team-layer-v1
          branch: evolution/daily-${{ github.run_number }}
          commit-message: |
            evo: daily aggregation run #${{ github.run_number }}

            Generated by team-evolve-daily.yml
          title: "🧬 Daily Evolution Review #${{ github.run_number }}"
          body-path: sidechain/aggregate_report.md
          labels: |
            evolution
            auto-generated
          delete-branch: true

      - name: Summary
        if: always()
        run: |
          echo "## 🧬 Evolution Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f sidechain/aggregate_report.md ]; then
            cat sidechain/aggregate_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No aggregate report produced._" >> "$GITHUB_STEP_SUMMARY"
          fi
